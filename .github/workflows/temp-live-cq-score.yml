name: Temp Live CQ Score
on:
  push:
    paths:
      - '.github/workflows/temp-live-cq-score.yml'
  workflow_dispatch:
jobs:
  cq:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests scikit-learn
      - name: Build live candle quality model
        shell: bash
        run: |
          python - <<'PY'
          import json, statistics, datetime, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests, numpy as np
          from sklearn.pipeline import make_pipeline
          from sklearn.preprocessing import StandardScaler
          from sklearn.linear_model import LogisticRegression
          from sklearn.tree import DecisionTreeClassifier, export_text
          from sklearn.model_selection import LeaveOneOut, cross_val_predict
          from sklearn.metrics import accuracy_score, balanced_accuracy_score, confusion_matrix

          GREEN={'1000PEPE','ACE','APR','AVAX','HEI','HYPE','TAO','WLD'}
          RED={'ADA','CYS','GRVT','HOME','NEAR','SOL','VELVET'}
          REVIEW=['1000PEPE','ACE','ADA','AKE','APR','AVAX','BEAT','BTW','CAP','CYS','ETH','GRVT','HEI','HOME','HYPE','LINK','NEAR','PUMP','SOL','SUI','TAO','TUT','UNI','VELVET','WLD','XRP','ZEC']
          LABELED=GREEN|RED
          WINDOWS={'4h':80,'8h':160,'12h':240}
          BASES=['https://api.pipai.org','https://fapi.binance.com']

          def pct(xs,p):
              ys=sorted(xs)
              if not ys:return 0.0
              x=(len(ys)-1)*p; lo=int(x); hi=min(lo+1,len(ys)-1)
              return ys[lo] if lo==hi else ys[lo]*(hi-x)+ys[hi]*(x-lo)

          def fetch(sym):
              errs=[]
              for base in BASES:
                  for attempt in range(3):
                      try:
                          r=requests.get(f'{base}/fapi/v1/klines',params={'symbol':sym+'USDT','interval':'3m','limit':500},timeout=12)
                          r.raise_for_status(); kl=r.json(); out=[]
                          for k in kl:
                              ts=int(k[0]); o,h,l,c=map(float,[k[1],k[2],k[3],k[4]])
                              if h<=l or c<=0: continue
                              out.append({'ts':ts,'o':o,'h':h,'l':l,'c':c})
                          if len(out)>=100:return sym,out,base
                          errs.append(f'{base}:short={len(out)}')
                      except Exception as e:
                          errs.append(f'{base}:{type(e).__name__}:{e}')
                      time.sleep(.25*(attempt+1))
              raise RuntimeError(' | '.join(errs[-6:]))

          raw={}; sources={}; errors=[]
          with ThreadPoolExecutor(max_workers=8) as ex:
              fs={ex.submit(fetch,s):s for s in REVIEW}
              for f in as_completed(fs):
                  s=fs[f]
                  try:
                      sym,rows,base=f.result(); raw[sym]=rows; sources[sym]=base
                  except Exception as e: errors.append({'symbol':s,'error':str(e)})

          def features(rows,n):
              xs=rows[-n:]
              if len(xs)<max(40,n//2):return None
              ranges=[]; maxw=[]; bodyshare=[]; closes=[]; highs=[]; lows=[]
              for x in xs:
                  rng=x['h']-x['l']; up=max(0,x['h']-max(x['o'],x['c'])); dn=max(0,min(x['o'],x['c'])-x['l'])
                  ranges.append(rng/x['c']); maxw.append(max(up,dn)/x['c']); bodyshare.append(abs(x['c']-x['o'])/rng)
                  closes.append(x['c']); highs.append(x['h']); lows.append(x['l'])
              spikes=[]; steps=[]; ers=[]
              for i in range(20,len(xs)):
                  med=statistics.median(ranges[i-20:i])
                  if med>0:
                      spikes.append(maxw[i]/med); steps.append(abs(closes[i]-closes[i-1])/closes[i]/med)
                  path=sum(abs(closes[j]-closes[j-1]) for j in range(i-19,i+1))
                  if path>0:ers.append(abs(closes[i]-closes[i-20])/path)
              overlaps=[]
              for i in range(1,len(xs)):
                  inter=max(0,min(highs[i],highs[i-1])-max(lows[i],lows[i-1])); den=min(highs[i]-lows[i],highs[i-1]-lows[i-1])
                  overlaps.append(inter/den if den>0 else 1)
              return {
                'range_med_pct':statistics.median(ranges)*100,
                'wick_p90':pct(spikes,.90),
                'wick_gt1_pct':100*sum(v>=1 for v in spikes)/len(spikes),
                'body_share_med':statistics.median(bodyshare),
                'doji_pct':100*sum(v<.25 for v in bodyshare)/len(bodyshare),
                'overlap_med':statistics.median(overlaps),
                'close_step_med':statistics.median(steps),
                'efficiency20_med':statistics.median(ers),
              }

          feats={w:{} for w in WINDOWS}
          for w,n in WINDOWS.items():
              for s,rows in raw.items():
                  f=features(rows,n)
                  if f:feats[w][s]=f

          subsets={
            'wick':['wick_p90','wick_gt1_pct'],
            'run':['body_share_med','overlap_med','efficiency20_med'],
            'wick_run':['range_med_pct','wick_p90','wick_gt1_pct','body_share_med','overlap_med','efficiency20_med'],
            'full':['range_med_pct','wick_p90','wick_gt1_pct','body_share_med','doji_pct','overlap_med','close_step_med','efficiency20_med']
          }
          trials=[]; loo=LeaveOneOut()
          for w in WINDOWS:
              names=sorted(s for s in LABELED if s in feats[w]); y=np.array([1 if s in GREEN else 0 for s in names])
              for sub,cols in subsets.items():
                  X=np.array([[feats[w][s][c] for c in cols] for s in names],float)
                  for C in [.1,.3,1,3,10]:
                      m=make_pipeline(StandardScaler(),LogisticRegression(C=C,class_weight='balanced',solver='liblinear',max_iter=2000))
                      p=cross_val_predict(m,X,y,cv=loo)
                      trials.append({'kind':'logistic','window':w,'subset':sub,'param':C,'n':len(names),'accuracy':float(accuracy_score(y,p)),'balanced_accuracy':float(balanced_accuracy_score(y,p)),'confusion':confusion_matrix(y,p,labels=[0,1]).tolist(),'symbols':names,'pred':[int(v) for v in p]})
                  for depth in [1,2,3]:
                      for leaf in [1,2,3]:
                          m=DecisionTreeClassifier(max_depth=depth,min_samples_leaf=leaf,class_weight='balanced',random_state=1)
                          p=cross_val_predict(m,X,y,cv=loo)
                          trials.append({'kind':'tree','window':w,'subset':sub,'param':f'd{depth}l{leaf}','n':len(names),'accuracy':float(accuracy_score(y,p)),'balanced_accuracy':float(balanced_accuracy_score(y,p)),'confusion':confusion_matrix(y,p,labels=[0,1]).tolist(),'symbols':names,'pred':[int(v) for v in p]})
          trials.sort(key=lambda z:(z['balanced_accuracy'],z['accuracy'],-len(subsets[z['subset']]),1 if z['kind']=='tree' else 0),reverse=True)
          best=trials[0]; w=best['window']; cols=subsets[best['subset']]; names=best['symbols']; y=np.array([1 if s in GREEN else 0 for s in names]); X=np.array([[feats[w][s][c] for c in cols] for s in names],float)
          # Always fit a smooth logistic score on the selected window/features; classifier comparison is reported separately.
          score_model=make_pipeline(StandardScaler(),LogisticRegression(C=1.0,class_weight='balanced',solver='liblinear',max_iter=2000)).fit(X,y)
          scored=[]
          for s in REVIEW:
              if s not in feats[w]:continue
              x=np.array([[feats[w][s][c] for c in cols]],float); p=float(score_model.predict_proba(x)[0,1])
              scored.append({'symbol':s,'label':'GREEN' if s in GREEN else ('RED' if s in RED else 'NEUTRAL'),'score':round(p*100,1),'pred':'PASS' if p>=.5 else 'FAIL','features':{c:round(float(feats[w][s][c]),4) for c in cols}})
          scored.sort(key=lambda r:r['score'],reverse=True)
          rule=None
          if best['kind']=='tree':
              depth=int(best['param'].split('l')[0][1:]); leaf=int(best['param'].split('l')[1]); tm=DecisionTreeClassifier(max_depth=depth,min_samples_leaf=leaf,class_weight='balanced',random_state=1).fit(X,y); rule=export_text(tm,feature_names=cols)
          out={'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'latest_candle_utc':datetime.datetime.fromtimestamp(max(v[-1]['ts'] for v in raw.values())/1000,datetime.timezone.utc).isoformat(),'available_labeled':len(names),'missing_labeled':sorted(LABELED-set(names)),'best_loocv':{**best,'accuracy':round(best['accuracy'],4),'balanced_accuracy':round(best['balanced_accuracy'],4)},'top_trials':[{**t,'accuracy':round(t['accuracy'],4),'balanced_accuracy':round(t['balanced_accuracy'],4)} for t in trials[:15]],'tree_rule':rule,'score_window':w,'score_features':cols,'scores':scored,'sources':sources,'errors':errors}
          open('live_cq_score.json','w').write(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-cq-score
          path: live_cq_score.json
          retention-days: 1
