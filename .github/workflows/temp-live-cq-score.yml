name: Temp Live CQ Score
on:
  push:
    paths:
      - '.github/workflows/temp-live-cq-score.yml'
  workflow_dispatch:
jobs:
  cq:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests scikit-learn
      - name: Build live candle quality model
        shell: bash
        run: |
          python - <<'PY'
          import json, math, statistics, datetime
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests
          import numpy as np
          from sklearn.pipeline import make_pipeline
          from sklearn.preprocessing import StandardScaler
          from sklearn.linear_model import LogisticRegression
          from sklearn.model_selection import LeaveOneOut, cross_val_predict
          from sklearn.metrics import accuracy_score, balanced_accuracy_score, confusion_matrix

          BASE='https://api.pipai.org'
          GREEN={'1000PEPE','ACE','APR','AVAX','HEI','HYPE','TAO','WLD'}
          RED={'ADA','CYS','GRVT','HOME','NEAR','SOL','VELVET'}
          REVIEW=['1000PEPE','ACE','ADA','AKE','APR','AVAX','BEAT','BTW','CAP','CYS','ETH','GRVT','HEI','HOME','HYPE','LINK','NEAR','PUMP','SOL','SUI','TAO','TUT','UNI','VELVET','WLD','XRP','ZEC']
          LABELED=GREEN|RED
          WINDOWS={'4h':80,'8h':160,'12h':240}

          def pct(xs,p):
              ys=sorted(xs)
              if not ys: return 0.0
              x=(len(ys)-1)*p; lo=int(x); hi=min(lo+1,len(ys)-1)
              return ys[lo] if lo==hi else ys[lo]*(hi-x)+ys[hi]*(x-lo)

          def fetch(sym):
              r=requests.get(f'{BASE}/fapi/v1/klines',params={'symbol':sym+'USDT','interval':'3m','limit':500},timeout=15)
              r.raise_for_status(); kl=r.json(); out=[]
              for k in kl:
                  ts=int(k[0]); o,h,l,c=map(float,[k[1],k[2],k[3],k[4]])
                  if h<=l or c<=0: continue
                  out.append({'ts':ts,'o':o,'h':h,'l':l,'c':c})
              return sym,out

          raw={}; errors=[]
          with ThreadPoolExecutor(max_workers=12) as ex:
              fs={ex.submit(fetch,s):s for s in REVIEW}
              for f in as_completed(fs):
                  s=fs[f]
                  try:
                      sym,rows=f.result(); raw[sym]=rows
                  except Exception as e: errors.append({'symbol':s,'error':str(e)})

          def features(rows,n):
              xs=rows[-n:]
              if len(xs)<max(40,n//2): return None
              ranges=[]; maxw=[]; bodyshare=[]; closes=[]; highs=[]; lows=[]
              for x in xs:
                  rng=x['h']-x['l']; up=max(0,x['h']-max(x['o'],x['c'])); dn=max(0,min(x['o'],x['c'])-x['l'])
                  ranges.append(rng/x['c']); maxw.append(max(up,dn)/x['c']); bodyshare.append(abs(x['c']-x['o'])/rng)
                  closes.append(x['c']); highs.append(x['h']); lows.append(x['l'])
              spikes=[]; steps=[]; ers=[]
              for i in range(len(xs)):
                  if i>=20:
                      med=statistics.median(ranges[i-20:i])
                      if med>0:
                          spikes.append(maxw[i]/med)
                          steps.append(abs(closes[i]-closes[i-1])/closes[i]/med)
                      path=sum(abs(closes[j]-closes[j-1]) for j in range(i-19,i+1))
                      if path>0: ers.append(abs(closes[i]-closes[i-20])/path)
              overlaps=[]
              for i in range(1,len(xs)):
                  inter=max(0,min(highs[i],highs[i-1])-max(lows[i],lows[i-1]))
                  den=min(highs[i]-lows[i],highs[i-1]-lows[i-1])
                  overlaps.append(inter/den if den>0 else 1.0)
              return {
                'range_med_pct':statistics.median(ranges)*100,
                'wick_p90':pct(spikes,.90),
                'wick_gt1_pct':100*sum(v>=1 for v in spikes)/len(spikes) if spikes else 100,
                'body_share_med':statistics.median(bodyshare),
                'doji_pct':100*sum(v<.25 for v in bodyshare)/len(bodyshare),
                'overlap_med':statistics.median(overlaps) if overlaps else 1,
                'close_step_med':statistics.median(steps) if steps else 0,
                'efficiency20_med':statistics.median(ers) if ers else 0,
              }

          feats={w:{} for w in WINDOWS}
          for w,n in WINDOWS.items():
              for s,rows in raw.items():
                  f=features(rows,n)
                  if f: feats[w][s]=f

          subsets={
            'wick':['wick_p90','wick_gt1_pct'],
            'wick_run':['range_med_pct','wick_p90','wick_gt1_pct','body_share_med','close_step_med'],
            'full':['range_med_pct','wick_p90','wick_gt1_pct','body_share_med','doji_pct','overlap_med','close_step_med','efficiency20_med']
          }
          trials=[]
          for w in WINDOWS:
              names=sorted(s for s in LABELED if s in feats[w])
              y=np.array([1 if s in GREEN else 0 for s in names])
              for sub,cols in subsets.items():
                  X=np.array([[feats[w][s][c] for c in cols] for s in names],dtype=float)
                  for C in [0.1,0.3,1.0,3.0,10.0]:
                      model=make_pipeline(StandardScaler(),LogisticRegression(C=C,class_weight='balanced',solver='liblinear',max_iter=2000))
                      pred=cross_val_predict(model,X,y,cv=LeaveOneOut(),method='predict')
                      trials.append({'window':w,'subset':sub,'C':C,'n':len(names),'accuracy':round(float(accuracy_score(y,pred)),4),'balanced_accuracy':round(float(balanced_accuracy_score(y,pred)),4),'confusion':confusion_matrix(y,pred,labels=[0,1]).tolist(),'symbols':names,'pred':[int(v) for v in pred]})
          trials.sort(key=lambda z:(z['balanced_accuracy'],z['accuracy'],-len(subsets[z['subset']])) ,reverse=True)
          best=trials[0]
          cols=subsets[best['subset']]; w=best['window']; names=best['symbols']; y=np.array([1 if s in GREEN else 0 for s in names])
          X=np.array([[feats[w][s][c] for c in cols] for s in names],dtype=float)
          final=make_pipeline(StandardScaler(),LogisticRegression(C=best['C'],class_weight='balanced',solver='liblinear',max_iter=2000))
          final.fit(X,y)
          scored=[]
          for s in REVIEW:
              if s not in feats[w]: continue
              x=np.array([[feats[w][s][c] for c in cols]],dtype=float)
              p=float(final.predict_proba(x)[0,1])
              scored.append({'symbol':s,'label':'GREEN' if s in GREEN else ('RED' if s in RED else 'NEUTRAL'),'score':round(p*100,1),'pred':'PASS' if p>=.5 else 'FAIL','features':{c:round(float(feats[w][s][c]),4) for c in cols}})
          scored.sort(key=lambda r:r['score'],reverse=True)
          scaler=final.named_steps['standardscaler']; lr=final.named_steps['logisticregression']
          model_info={'window':w,'subset':best['subset'],'C':best['C'],'features':cols,'coef':{c:round(float(v),4) for c,v in zip(cols,lr.coef_[0])},'intercept':round(float(lr.intercept_[0]),4),'means':{c:round(float(v),6) for c,v in zip(cols,scaler.mean_)},'scales':{c:round(float(v),6) for c,v in zip(cols,scaler.scale_)}}
          out={'generated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'latest_candle_utc':datetime.datetime.fromtimestamp(max(v[-1]['ts'] for v in raw.values())/1000,datetime.timezone.utc).isoformat(),'labels':{'green':sorted(GREEN),'red':sorted(RED)},'best_loocv':best,'top_trials':trials[:12],'model':model_info,'scores':scored,'errors':errors}
          open('live_cq_score.json','w').write(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-cq-score
          path: live_cq_score.json
          retention-days: 1
