name: WR FX DayZone Debug
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/wr-fx-dayzone-debug.yml']
jobs:
  debug:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.4 beautifulsoup4==4.13.4 websocket-client==1.8.0
      - name: Fetch frozen engine
        run: |
          mkdir -p /tmp/runner3/formal-tests
          curl -fsSL https://raw.githubusercontent.com/louisalviss/runner-3/main/formal-tests/wr_cross_asset_screen.py -o /tmp/runner3/formal-tests/wr_cross_asset_screen.py
      - name: Run and capture
        shell: bash
        run: |
          set +e
          python wr_fx_index_canonical_dayzone_2014_2025.py --group forex > wr_fx_debug.log 2>&1
          code=$?
          echo "$code" > wr_fx_exit.txt
          cat wr_fx_debug.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: wr-fx-dayzone-debug
          path: |
            wr_fx_debug.log
            wr_fx_exit.txt
            wr_forex_canonical_dayzone_2018_2025.json
          if-no-files-found: warn
