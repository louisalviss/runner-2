name: Crypto provider probe
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: write
jobs:
  probe:
    if: github.event.issue.title == '[crypto-provider-probe]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Probe decoded source structure and reachable endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, base64, json, zlib, urllib.request, time
          from pathlib import Path
          text=Path('a.py').read_text(); tree=ast.parse(text)
          source_s=None
          for n in tree.body:
              if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='SOURCE' for t in n.targets):
                  source_s=ast.literal_eval(n.value); break
          if not source_s: raise SystemExit('SOURCE not found')
          src=zlib.decompress(base64.b85decode(source_s)).decode(); st=ast.parse(src)
          urls=[]; funcs=[]; names=[]
          for n in ast.walk(st):
              if isinstance(n,ast.Constant) and isinstance(n.value,str) and ('http://' in n.value or 'https://' in n.value or 'binance' in n.value.lower()): urls.append(n.value)
              if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and any(k in n.name.lower() for k in ('fetch','market','ticker','kline','source','request')): funcs.append(n.name)
              if isinstance(n,ast.Assign):
                  for t in n.targets:
                      if isinstance(t,ast.Name) and any(k in t.id.lower() for k in ('base','url','host','source','provider')): names.append(t.id)
          def hit(url):
              t=time.time()
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'wr-probe/1.0'})
                  with urllib.request.urlopen(req,timeout=8) as r:
                      b=r.read(300)
                      return {'ok':True,'status':r.status,'ms':round((time.time()-t)*1000),'sample':b[:120].decode('utf-8','replace')}
              except Exception as e:
                  return {'ok':False,'error':f'{type(e).__name__}: {e}','ms':round((time.time()-t)*1000)}
          endpoints={
            'fapi_exchangeInfo':'https://fapi.binance.com/fapi/v1/exchangeInfo',
            'fapi_ticker24':'https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT',
            'fapi_klines':'https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=1d&limit=2',
            'www_exchangeInfo':'https://www.binance.com/fapi/v1/exchangeInfo',
            'www_ticker24':'https://www.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT',
            'www_ticker_all':'https://www.binance.com/fapi/v1/ticker/24hr',
            'www_klines':'https://www.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=1d&limit=2'
          }
          out={'urls':sorted(set(urls)),'functions':sorted(set(funcs)),'candidate_names':sorted(set(names)),'reachability':{k:hit(v) for k,v in endpoints.items()}}
          Path('diagnostics').mkdir(exist_ok=True)
          Path('diagnostics/crypto_provider_probe.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          PY
          git config user.name 'crypto-probe[bot]'; git config user.email 'crypto-probe[bot]@users.noreply.github.com'
          git add diagnostics/crypto_provider_probe.json
          git commit -m 'diag: crypto provider probe [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
