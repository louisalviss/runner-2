name: Crypto provider failover fix
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.issue.title == '[crypto-provider-fix]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Patch encoded crypto source provider pool
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, base64, json, zlib
          from pathlib import Path
          p=Path('a.py'); outer=p.read_text(); tree=ast.parse(outer)
          assign=None; source_s=None
          for n in tree.body:
              if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='SOURCE' for t in n.targets):
                  assign=n; source_s=ast.literal_eval(n.value); break
          if assign is None or source_s is None: raise SystemExit('SOURCE not found')
          src=zlib.decompress(base64.b85decode(source_s)).decode('utf-8')
          st=ast.parse(src)
          pipai='https://api.pipai.org'; fapi='https://fapi.binance.com'; www='https://www.binance.com'
          patched=0
          for n in ast.walk(st):
              if isinstance(n,(ast.List,ast.Tuple)):
                  vals=[e.value if isinstance(e,ast.Constant) and isinstance(e.value,str) else None for e in n.elts]
                  if pipai in vals and fapi in vals and www not in vals:
                      idx=vals.index(fapi)
                      n.elts.insert(idx,ast.Constant(value=www)); patched+=1
          if patched < 1:
              raise SystemExit('provider pool pattern not found; refusing blind patch')
          ast.fix_missing_locations(st)
          new_src=ast.unparse(st)+'\n'
          compile(new_src,'<runner2-patched>','exec')
          enc=base64.b85encode(zlib.compress(new_src.encode('utf-8'),9)).decode('ascii')
          lines=outer.splitlines()
          start=assign.lineno-1; end=assign.end_lineno
          lines[start:end]=['SOURCE = '+repr(enc)]
          p.write_text('\n'.join(lines)+'\n')
          Path('diagnostics').mkdir(exist_ok=True)
          Path('diagnostics/crypto_provider_fix.json').write_text(json.dumps({'patched_provider_nodes':patched,'provider_order':[pipai,www,fapi]},indent=2))
          PY
          python -m py_compile a.py
      - name: Install runtime
        shell: bash
        run: |
          python a.py 7 >/tmp/requirements.txt
          pip install --no-input -r /tmp/requirements.txt
      - name: Recovery preclose for current crypto session
        id: recovery
        shell: bash
        run: |
          set +e
          python a.py 5 >diagnostics/crypto_recovery_stdout.txt 2>diagnostics/crypto_recovery_stderr.txt
          rc=$?
          set -e
          echo "$rc" > diagnostics/crypto_recovery_exit_code.txt
          python - <<'PY'
          import base64,json,zlib
          from pathlib import Path
          KEY=bytes([0x5e,0x21,0xa9,0x8c,0x0f,0x73,0xd4,0xb6,0x11,0xc2,0xee,0x9a,0x48,0x73,0x5f,0xd0])
          def dec(path):
              raw=Path(path).read_bytes().strip(); masked=base64.b85decode(raw)
              comp=bytes(b ^ KEY[i%len(KEY)] for i,b in enumerate(masked))
              return json.loads(zlib.decompress(comp))
          live=dec('o/0')
          out={k:live.get(k) for k in ('session_date','updated_at_utc','latest_mode','latest_scan_status','latest_successful_scan_at_utc','union_count','active_count')}
          Path('diagnostics/crypto_recovery_result.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out))
          if out.get('latest_mode')!='preclose' or out.get('latest_scan_status')!='COMPLETE':
              raise SystemExit('recovery preclose did not COMPLETE')
          PY
      - name: Persist patch and recovered state
        if: always()
        shell: bash
        run: |
          git config user.name 'crypto-failover-fix[bot]'
          git config user.email 'crypto-failover-fix[bot]@users.noreply.github.com'
          git add a.py o diagnostics/crypto_provider_fix.json diagnostics/crypto_recovery_*.txt diagnostics/crypto_recovery_result.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: add Binance futures fallback and recover crypto [skip ci]'
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i*2))
          done
          exit 91
