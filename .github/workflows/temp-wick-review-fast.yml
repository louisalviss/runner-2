name: Temp Wick Review Fast
on:
  push:
    paths:
      - '.github/workflows/temp-wick-review-fast.yml'
  workflow_dispatch:
jobs:
  wick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Measure marked rows
        shell: bash
        run: |
          python - <<'PY'
          import json, statistics
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests
          BASE='https://api.pipai.org'
          symbols=['1000PEPEUSDT.P','ACEUSDT.P','ADAUSDT.P','AKEUSDT.P','APRUSDT.P','AVAXUSDT.P','BEATUSDT.P','BTWUSDT.P','CAPUSDT.P','CYSUSDT.P']
          green={'1000PEPEUSDT.P','ACEUSDT.P','APRUSDT.P','AVAXUSDT.P'}
          red={'ADAUSDT.P'}
          def pct(xs,p):
              ys=sorted(xs); x=(len(ys)-1)*p; lo=int(x); hi=min(lo+1,len(ys)-1); return ys[lo] if lo==hi else ys[lo]*(hi-x)+ys[hi]*(x-lo)
          def one(s):
              raw=s.replace('.P','')
              r=requests.get(f'{BASE}/fapi/v1/klines',params={'symbol':raw,'interval':'3m','limit':480},timeout=12)
              r.raise_for_status(); kl=r.json(); candles=[]
              for k in kl:
                  o,h,l,c=map(float,[k[1],k[2],k[3],k[4]])
                  mid=(o+c)/2 if (o+c)>0 else c
                  rng=h-l
                  if rng<=0 or mid<=0: continue
                  up=max(0,h-max(o,c)); dn=max(0,min(o,c)-l)
                  candles.append({'range_pct':rng/mid,'maxwick_pct':max(up,dn)/mid,'sumwick_pct':(up+dn)/mid,'body_pct':abs(c-o)/mid})
              ranges=[x['range_pct'] for x in candles]; medrng=statistics.median(ranges)
              spike=[x['maxwick_pct']/medrng for x in candles]
              sumspike=[x['sumwick_pct']/medrng for x in candles]
              bodies=[x['body_pct']/medrng for x in candles]
              return {
                'symbol':s,'label':'GREEN' if s in green else ('RED' if s in red else 'UNMARKED'),'candles':len(candles),
                'median_range_pct':round(medrng*100,4),
                'maxwick_vs_medrange_med':round(statistics.median(spike),3),
                'maxwick_vs_medrange_p90':round(pct(spike,.90),3),
                'maxwick_vs_medrange_p95':round(pct(spike,.95),3),
                'sumwick_vs_medrange_p90':round(pct(sumspike,.90),3),
                'wick_spike_gt1_pct':round(100*sum(x>=1 for x in spike)/len(spike),2),
                'wick_spike_gt1_5_pct':round(100*sum(x>=1.5 for x in spike)/len(spike),2),
                'body_vs_medrange_med':round(statistics.median(bodies),3)
              }
          rows=[]; errors=[]
          with ThreadPoolExecutor(max_workers=10) as ex:
              fs={ex.submit(one,s):s for s in symbols}
              for f in as_completed(fs):
                  try: rows.append(f.result())
                  except Exception as e: errors.append({'symbol':fs[f],'error':str(e)})
          rows.sort(key=lambda r:(r['maxwick_vs_medrange_p90'],r['wick_spike_gt1_pct']))
          out={'definition':'3m last 24h; spike = max(upper wick,lower wick) / median 3m candle range','rows':rows,'errors':errors}
          open('wick_review_fast.json','w').write(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wick-review-fast
          path: wick_review_fast.json
          retention-days: 1
