name: Generic Spot Archive Symbol Index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - archive_symbol_index.py
      - .github/workflows/generic-spot-symbol-index.yml

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install requests
      - name: Static check
        run: python -m py_compile archive_symbol_index.py
      - name: Build spot archive symbol index
        run: >-
          python archive_symbol_index.py
          --prefix data/spot/monthly/klines/
          --out spot_archive_symbol_index.json
      - name: Upload spot symbol-index artifact
        uses: actions/upload-artifact@v4
        with:
          name: generic-binance-spot-archive-symbol-index
          path: spot_archive_symbol_index.json
          if-no-files-found: error
          retention-days: 1
