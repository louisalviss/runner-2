name: temp-crypto-scan
on:
  push:
    branches: [main]
    paths: [".github/workflows/temp-crypto-scan.yml"]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          python a.py 7 >/tmp/r
          pip install --no-input -r /tmp/r
      - shell: bash
        run: |
          set +e
          python a.py 1
          x=$?
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A o 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m ". [skip ci]" && git push; fi
          exit "$x"
