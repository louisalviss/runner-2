name: TV Economic Calendar Probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/tv-economic-calendar-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe 2024 US economic calendar
        run: |
          python - <<'PY'
          import requests
          u='https://economic-calendar.tradingview.com/events'
          p={'from':'2024-01-01T00:00:00.000Z','to':'2024-01-31T23:59:59.999Z','countries':'US'}
          r=requests.get(u,params=p,headers={'Origin':'https://www.tradingview.com','User-Agent':'Mozilla/5.0'},timeout=30)
          r.raise_for_status()
          open('tvprobe.json','w').write(r.text)
          print('bytes',len(r.text))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tv-economic-calendar-probe
          path: tvprobe.json
