name: Temp Daily Candle Quality
on:
  push:
    paths:
      - '.github/workflows/temp-daily-candle-quality.yml'
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Measure daily candle quality
        shell: bash
        run: |
          python - <<'PY'
          import json, statistics, datetime
          from collections import defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests

          BASE='https://api.pipai.org'
          GREEN={'1000PEPE','ACE','APR','AVAX','HEI','HYPE','TAO','WLD'}
          RED={'ADA','CYS','GRVT','HOME','NEAR','SOL','VELVET'}
          SYMBOLS=sorted(GREEN|RED)

          def pct(xs,p):
              ys=sorted(xs)
              if not ys: return None
              x=(len(ys)-1)*p; lo=int(x); hi=min(lo+1,len(ys)-1)
              return ys[lo] if lo==hi else ys[lo]*(hi-x)+ys[hi]*(x-lo)

          def one(sym):
              r=requests.get(f'{BASE}/fapi/v1/klines',params={'symbol':sym+'USDT','interval':'3m','limit':1500},timeout=15)
              r.raise_for_status(); kl=r.json(); xs=[]
              for k in kl:
                  ts=int(k[0]); o,h,l,c=map(float,[k[1],k[2],k[3],k[4]])
                  mid=(o+c)/2 if (o+c)>0 else c; rng=h-l
                  if rng<=0 or mid<=0: continue
                  up=max(0,h-max(o,c)); dn=max(0,min(o,c)-l)
                  xs.append({'ts':ts,'range':rng/mid,'wick':max(up,dn)/mid,'body':abs(c-o)/mid})
              by=defaultdict(list)
              for i,x in enumerate(xs):
                  if i<20: continue
                  utc=datetime.datetime.fromtimestamp(x['ts']/1000,datetime.timezone.utc)
                  vn=utc+datetime.timedelta(hours=7)
                  hr=vn.hour+vn.minute/60
                  in_b=(16<=hr<19)
                  in_c=(hr>=23 or hr<2)
                  if not (in_b or in_c): continue
                  session_date=vn.date() if hr>=2 else (vn.date()-datetime.timedelta(days=1))
                  local=statistics.median(z['range'] for z in xs[i-20:i])
                  if local<=0: continue
                  by[str(session_date)].append((x['wick']/local,x['body']/local,x['range']))
              days=[]
              for d,vals in sorted(by.items()):
                  spikes=[v[0] for v in vals]; bodies=[v[1] for v in vals]; ranges=[v[2] for v in vals]
                  if len(spikes)<30: continue
                  p90=pct(spikes,.90); gt1=100*sum(x>=1 for x in spikes)/len(spikes)
                  days.append({
                    'date':d,'n':len(spikes),'wick_p90':round(p90,3),'spike_gt1_pct':round(gt1,2),
                    'body_med':round(statistics.median(bodies),3),'range_med_pct':round(statistics.median(ranges)*100,4),
                    'wick_pass': bool(p90<=0.90 and gt1<=6.0)
                  })
              return {'symbol':sym,'label':'GREEN' if sym in GREEN else 'RED','days':days}

          rows=[]; errors=[]
          with ThreadPoolExecutor(max_workers=12) as ex:
              fs={ex.submit(one,s):s for s in SYMBOLS}
              for f in as_completed(fs):
                  try: rows.append(f.result())
                  except Exception as e: errors.append({'symbol':fs[f],'error':str(e)})
          rows.sort(key=lambda r:r['symbol'])
          # summarize day-to-day flips and latest complete day (2026-08-14 expected at run time)
          for r in rows:
              ps=[d['wick_pass'] for d in r['days']]
              r['pass_days']=sum(ps); r['total_days']=len(ps); r['flip']=len(set(ps))>1 if ps else False
              if r['days']:
                  r['p90_span']=round(max(d['wick_p90'] for d in r['days'])-min(d['wick_p90'] for d in r['days']),3)
                  r['gt1_span']=round(max(d['spike_gt1_pct'] for d in r['days'])-min(d['spike_gt1_pct'] for d in r['days']),2)
          out={'definition':'3m candles grouped by Wave Rider VN session day; Zone B 16-19 + Zone C 23-02; 00-02 assigned to prior session date; wick=max wick / rolling median range(20); PASS=p90<=0.90 and spike>1x<=6%','rows':rows,'errors':errors}
          open('daily_candle_quality.json','w').write(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: daily-candle-quality
          path: daily_candle_quality.json
          retention-days: 1
