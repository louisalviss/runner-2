name: WR HistData long 2024
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wr-histdata-long-2024.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.4 beautifulsoup4==4.13.4 websocket-client==1.8.0
      - name: Fetch frozen Wave Rider engine
        run: git clone --depth=1 https://github.com/louisalviss/runner-3.git /tmp/runner3
      - name: Run 2024 independent validation
        run: python wr_histdata_long_2024.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr-histdata-long-2024
          path: wr_histdata_long_2024.json
          retention-days: 90
