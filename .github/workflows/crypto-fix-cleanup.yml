name: Crypto fix cleanup
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.issue.title == '[crypto-fix-cleanup]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Remove one-time fix artifacts
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/crypto-provider-probe.yml \
            .github/workflows/crypto-provider-fix.yml \
            .github/workflows/crypto-fix-cleanup.yml \
            diagnostics/crypto_provider_probe.json \
            diagnostics/crypto_provider_fix.json \
            diagnostics/crypto_recovery_exit_code.txt \
            diagnostics/crypto_recovery_result.json \
            diagnostics/crypto_recovery_stderr.txt \
            diagnostics/crypto_recovery_stdout.txt
          git config user.name 'crypto-cleanup[bot]'
          git config user.email 'crypto-cleanup[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-time crypto fix artifacts [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
