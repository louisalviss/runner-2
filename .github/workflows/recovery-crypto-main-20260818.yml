name: Recovery Crypto Main 2026-08-18

on:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: read

concurrency:
  group: recovery-crypto-main-20260818
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.issue.title == '[wr-recovery-crypto-main-20260818]'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Wait until Crypto Final retry window closes
        shell: bash
        run: |
          wait_seconds=$(python - <<'PY'
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo
          vn = ZoneInfo('Asia/Ho_Chi_Minh')
          now = datetime.now(timezone.utc).astimezone(vn)
          target = now.replace(hour=0, minute=16, second=0, microsecond=0)
          if now.hour >= 6:
              target += timedelta(days=1)
          print(max(0, int((target-now).total_seconds())))
          PY
          )
          echo "wait_seconds=$wait_seconds"
          if [ "$wait_seconds" -gt 0 ]; then sleep "$wait_seconds"; fi

      - name: Wait for production runner to become idle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            active=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/x.yml/runs?per_page=20" \
              | jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length')
            echo "active_x_runs=$active attempt=$attempt"
            if [ "$active" -eq 0 ]; then exit 0; fi
            sleep 10
          done
          echo "Production x.yml still active after wait" >&2
          exit 90

      - name: Install Crypto runtime
        shell: bash
        run: |
          python a.py 7 >/tmp/recovery_requirements.txt
          pip install --no-input -r /tmp/recovery_requirements.txt

      - name: Run explicit Crypto main recovery
        shell: bash
        run: |
          mkdir -p recovery
          set +e
          python a.py 3 >recovery/crypto_main_20260818_stdout.txt 2>recovery/crypto_main_20260818_stderr.txt
          rc=$?
          set -e
          printf '%s\n' "$rc" > recovery/crypto_main_20260818_exit_code.txt
          date -u +%FT%TZ > recovery/crypto_main_20260818_finished_utc.txt

          git config user.name 'wave-rider-crypto-recovery[bot]'
          git config user.email 'wave-rider-crypto-recovery[bot]@users.noreply.github.com'
          git add -A o recovery
          if ! git diff --cached --quiet; then
            git commit -m 'data: recover Crypto main 2026-08-18 [skip ci]'
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                pushed=1
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 2))
            done
            if [ "$pushed" -ne 1 ]; then exit 91; fi
          fi
          exit "$rc"
