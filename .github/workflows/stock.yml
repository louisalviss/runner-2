name: Wave Rider Stock Runtime

on:
  workflow_dispatch:
    inputs:
      m:
        description: "1=main 2=mid 3=preclose 4=smoothness 8=auto"
        required: false
        default: "8"
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock.yml"
  schedule:
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "45 16 * * 1-5"
    - cron: "45 17 * * 1-5"
    - cron: "45 19 * * 1-5"
    - cron: "45 20 * * 1-5"
    - cron: "15 22 * * 1-5"

concurrency:
  group: wave-rider-stock-runtime
  cancel-in-progress: false

jobs:
  stock:
    if: github.event_name != 'issues' || github.event.issue.title == '[wr-stock-probe]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_M: ${{ inputs.m }}
        run: |
          MODE=""
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "issues" ]]; then
            MODE=probe
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$INPUT_M" in
              1) MODE=main ;;
              2) MODE=mid ;;
              3) MODE=preclose ;;
              4) MODE=smoothness ;;
              8|*) MODE=auto ;;
            esac
          else
            read ET_HOUR ET_MINUTE <<<"$(python - <<'PY'
from datetime import datetime, timezone
from zoneinfo import ZoneInfo
x=datetime.now(timezone.utc).astimezone(ZoneInfo('America/New_York'))
print(x.hour, x.minute)
PY
)"
            if [[ "$EVENT_SCHEDULE" == "0 14 * * 1-5" || "$EVENT_SCHEDULE" == "0 15 * * 1-5" ]]; then
              [[ "$ET_HOUR" == "10" ]] && MODE=main || MODE=noop
            elif [[ "$EVENT_SCHEDULE" == "45 16 * * 1-5" || "$EVENT_SCHEDULE" == "45 17 * * 1-5" ]]; then
              [[ "$ET_HOUR" == "12" && "$ET_MINUTE" == "45" ]] && MODE=mid || MODE=noop
            elif [[ "$EVENT_SCHEDULE" == "45 19 * * 1-5" || "$EVENT_SCHEDULE" == "45 20 * * 1-5" ]]; then
              [[ "$ET_HOUR" == "15" && "$ET_MINUTE" == "45" ]] && MODE=preclose || MODE=noop
            elif [[ "$EVENT_SCHEDULE" == "15 22 * * 1-5" ]]; then
              MODE=smoothness
            else
              MODE=noop
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "resolved=$MODE schedule=$EVENT_SCHEDULE"

      - name: Download pinned producer source
        if: steps.mode.outputs.mode != 'noop'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wr-stock-src stock/diagnostics
          REF="5894027b3d76cf6c631f15139b39ebddac945d0d"
          for f in stock_runner.py stock_runner_entry.py requirements.txt; do
            curl --fail-with-body -sSL \
              "https://raw.githubusercontent.com/louisalviss/runner-1/$REF/$f" \
              -o "/tmp/wr-stock-src/$f"
          done
          printf '%s\n' "$REF" > stock/diagnostics/source_ref.txt

      - name: Install runtime
        if: steps.mode.outputs.mode != 'noop'
        shell: bash
        run: |
          set +e
          pip install --disable-pip-version-check -r /tmp/wr-stock-src/requirements.txt >stock/diagnostics/install_stdout.txt 2>stock/diagnostics/install_stderr.txt
          rc=$?
          set -e
          printf '%s\n' "$rc" > stock/diagnostics/install_exit_code.txt
          exit "$rc"

      - name: Run Stock producer
        if: steps.mode.outputs.mode != 'noop'
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          mkdir -p stock/diagnostics
          set +e
          (
            cd stock
            python /tmp/wr-stock-src/stock_runner_entry.py --mode "$MODE"
          ) >stock/diagnostics/last_stdout.txt 2>stock/diagnostics/last_stderr.txt
          rc=$?
          set -e
          printf '%s\n' "$rc" > stock/diagnostics/last_exit_code.txt
          date -u +%FT%TZ > stock/diagnostics/finished_utc.txt
          exit "$rc"

      - name: Persist Stock state and diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name "wave-rider-stock-runner[bot]"
          git config user.email "wave-rider-stock-runner[bot]@users.noreply.github.com"
          git add -A stock/o stock/diagnostics 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Stock state changes."
            exit 0
          fi
          git commit -m "data: Wave Rider Stock state [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Unable to persist Stock state after retries." >&2
          exit 1
