name: Temp Wick Zone Review
on:
  push:
    paths:
      - '.github/workflows/temp-wick-zone-review.yml'
  workflow_dispatch:
jobs:
  wick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Measure zone wick quality
        shell: bash
        run: |
          python - <<'PY'
          import json, statistics, datetime
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests
          BASE='https://api.pipai.org'
          symbols=['1000PEPEUSDT.P','ACEUSDT.P','ADAUSDT.P','AKEUSDT.P','APRUSDT.P','AVAXUSDT.P','BEATUSDT.P','BTWUSDT.P','CAPUSDT.P','CYSUSDT.P']
          green={'1000PEPEUSDT.P','ACEUSDT.P','APRUSDT.P','AVAXUSDT.P'}
          red={'ADAUSDT.P'}
          def pct(xs,p):
              ys=sorted(xs); x=(len(ys)-1)*p; lo=int(x); hi=min(lo+1,len(ys)-1); return ys[lo] if lo==hi else ys[lo]*(hi-x)+ys[hi]*(x-lo)
          def one(s):
              raw=s.replace('.P','')
              r=requests.get(f'{BASE}/fapi/v1/klines',params={'symbol':raw,'interval':'3m','limit':1500},timeout=15)
              r.raise_for_status(); kl=r.json(); xs=[]
              for k in kl:
                  ts=int(k[0]); o,h,l,c=map(float,[k[1],k[2],k[3],k[4]])
                  mid=(o+c)/2 if (o+c)>0 else c; rng=h-l
                  if rng<=0 or mid<=0: continue
                  up=max(0,h-max(o,c)); dn=max(0,min(o,c)-l)
                  xs.append({'ts':ts,'range':rng/mid,'wick':max(up,dn)/mid,'body':abs(c-o)/mid})
              spikes=[]; bodies=[]; zone_ranges=[]
              for i,x in enumerate(xs):
                  if i<20: continue
                  dt=datetime.datetime.fromtimestamp(x['ts']/1000,datetime.timezone.utc)
                  hr=dt.hour+dt.minute/60
                  # VN 16:00-19:00 => UTC 09:00-12:00; VN 23:00-02:00 => UTC 16:00-19:00
                  in_zone=(9<=hr<12) or (16<=hr<19)
                  if not in_zone: continue
                  local=statistics.median(z['range'] for z in xs[i-20:i])
                  if local<=0: continue
                  spikes.append(x['wick']/local); bodies.append(x['body']/local); zone_ranges.append(x['range'])
              return {
                'symbol':s,'label':'GREEN' if s in green else ('RED' if s in red else 'UNMARKED'),'zone_candles':len(spikes),
                'local_wick_p75':round(pct(spikes,.75),3),'local_wick_p90':round(pct(spikes,.90),3),'local_wick_p95':round(pct(spikes,.95),3),
                'spike_gt0_75_pct':round(100*sum(x>=.75 for x in spikes)/len(spikes),2),
                'spike_gt1_pct':round(100*sum(x>=1 for x in spikes)/len(spikes),2),
                'spike_gt1_5_pct':round(100*sum(x>=1.5 for x in spikes)/len(spikes),2),
                'body_local_med':round(statistics.median(bodies),3),
                'zone_range_med_pct':round(statistics.median(zone_ranges)*100,4)
              }
          rows=[]; errors=[]
          with ThreadPoolExecutor(max_workers=10) as ex:
              fs={ex.submit(one,s):s for s in symbols}
              for f in as_completed(fs):
                  try: rows.append(f.result())
                  except Exception as e: errors.append({'symbol':fs[f],'error':str(e)})
          rows.sort(key=lambda r:(r['local_wick_p90'],r['spike_gt1_pct']))
          out={'definition':'last 1500 x 3m; only VN 16-19 and 23-02; max wick / rolling median range(20)','rows':rows,'errors':errors}
          open('wick_zone_review.json','w').write(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wick-zone-review
          path: wick_zone_review.json
          retention-days: 1
