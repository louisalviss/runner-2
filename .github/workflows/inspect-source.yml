name: Inspect Source
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-source.yml"]

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Print relevant decoded source
        shell: bash
        run: |
          python - <<'PY'
          import ast, base64, zlib
          text=open('a.py',encoding='utf-8').read()
          mod=ast.parse(text)
          source=None
          for node in mod.body:
              if isinstance(node, ast.Assign) and any(isinstance(t,ast.Name) and t.id=='SOURCE' for t in node.targets):
                  source=ast.literal_eval(node.value)
                  break
          s=zlib.decompress(base64.b85decode(source)).decode('utf-8')
          lines=s.splitlines()
          needles=('metric request failure','kline_error_count','kline_errors','insufficient_history_count')
          hits=sorted({i for i,line in enumerate(lines) if any(n in line for n in needles)})
          for i in hits:
              print(f'--- around line {i+1} ---')
              for j in range(max(0,i-18),min(len(lines),i+22)):
                  print(f'{j+1:04d}: {lines[j]}')
          PY
